# Production overlay. Use: .\docker-update.ps1 -Prod
# Backend/.env: APP_ENV=production, SCHEDULER_ENABLED=false, explicit CORS_ORIGINS

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    environment:
      APP_ENV: production
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      BACKEND_REPLICAS: ${BACKEND_REPLICAS:-2}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M

  celery-worker:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  celery-beat:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  telegram-bot:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  db:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 192M
