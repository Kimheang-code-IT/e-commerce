# Generic example — see anyamusicschool.conf for production (anyamusicschool.com).
#
# Replace:
#   shop.example.com   → your public catalog domain (website_business)
#   admin.example.com  → staff-only admin UI (Frontend) — restrict by IP/VPN
#   /etc/nginx/snippets/admin-allowlist.conf → your office/VPN CIDRs
#
# website_business: Node on 127.0.0.1:3001 (docker or pm2)
# Backend API:       127.0.0.1:8000 (docker compose)

# --- Public product catalog (website_business) ---
server {
    listen 443 ssl http2;
    server_name shop.example.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Private admin app (Frontend) — NOT public ---
server {
    listen 443 ssl http2;
    server_name admin.example.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    include /etc/nginx/snippets/admin-allowlist.conf;

    root /var/www/ecom-admin;
    index index.html;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# /etc/nginx/snippets/admin-allowlist.conf
# allow 203.0.113.10;      # office public IP
# allow 10.0.0.0/8;        # VPN
# deny all;
