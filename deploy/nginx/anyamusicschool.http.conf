# Phase 1 — HTTP only (use BEFORE certbot / SSL certificates exist)
#
# Public catalog:  http://anyamusicschool.com        → website_business (:3001)
# Admin (login):   http://admin.anyamusicschool.com → Frontend static files
#
# Install:
#   sudo cp deploy/nginx/anyamusicschool.http.conf /etc/nginx/sites-available/anyamusicschool
#   sudo ln -sf /etc/nginx/sites-available/anyamusicschool /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get SSL:
#   sudo certbot --nginx -d anyamusicschool.com -d www.anyamusicschool.com -d admin.anyamusicschool.com
#
# After certbot succeeds you can optionally replace with anyamusicschool.conf (HTTPS).

# --- Public website (no login) ---
server {
    listen 80;
    listen [::]:80;
    server_name anyamusicschool.com www.anyamusicschool.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Admin app (login required in the app) ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.anyamusicschool.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /var/www/anyamusicschool-admin;
    index index.html;

    client_max_body_size 20m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
