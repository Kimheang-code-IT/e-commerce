# Anya Music School — production nginx
#
# Public catalog:  https://anyamusicschool.com        → website_business (Docker :3001)
# Private admin:    https://admin.anyamusicschool.com → Frontend static (IP allowlist)
# API + uploads:    proxied to Backend (Docker :8000)
#
# Install:
#   sudo cp deploy/nginx/anyamusicschool.conf /etc/nginx/sites-available/anyamusicschool
#   sudo ln -sf /etc/nginx/sites-available/anyamusicschool /etc/nginx/sites-enabled/
#   sudo cp deploy/nginx/admin-allowlist.conf.example /etc/nginx/snippets/admin-allowlist.conf
#   # Edit admin-allowlist.conf — add your office/VPN IPs, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt):
#   sudo certbot --nginx -d anyamusicschool.com -d www.anyamusicschool.com -d admin.anyamusicschool.com

# --- HTTP → HTTPS (public) ---
server {
    listen 80;
    listen [::]:80;
    server_name anyamusicschool.com www.anyamusicschool.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://anyamusicschool.com$request_uri;
    }
}

# --- HTTP → HTTPS (admin) ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.anyamusicschool.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin.anyamusicschool.com$request_uri;
    }
}

# --- www → apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.anyamusicschool.com;

    ssl_certificate     /etc/letsencrypt/live/anyamusicschool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anyamusicschool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://anyamusicschool.com$request_uri;
}

# --- Public product catalog (website_business) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anyamusicschool.com;

    ssl_certificate     /etc/letsencrypt/live/anyamusicschool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anyamusicschool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Private admin (Frontend) — staff only ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.anyamusicschool.com;

    ssl_certificate     /etc/letsencrypt/live/anyamusicschool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anyamusicschool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/admin-allowlist.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/anyamusicschool-admin;
    index index.html;

    client_max_body_size 20m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
