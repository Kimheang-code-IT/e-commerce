# Docker app stack only — nginx/TLS on the host (ports 80/443). API: 127.0.0.1:8000
# Scale API: docker compose up -d --scale backend=2 (Docker LB on published 8000)
# Run only ONE telegram-bot instance (polling cannot be duplicated).
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - ./Backend/.env
    environment:
      BACKEND_REPLICAS: ${BACKEND_REPLICAS:-1}
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - ./Backend/credentials:/app/credentials:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); exit(0 if r.status==200 else 1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ecom-postgres
    env_file:
      - ./Backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - ./Backend/.env
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    volumes:
      - backend_uploads:/app/uploads
      - ./Backend/credentials:/app/credentials:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.core.celery_app.celery_app inspect ping --timeout=10 2>/dev/null | grep -q OK"
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecom-telegram-bot
    command: python -m app.scripts.telegram_polling
    env_file:
      - ./Backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  website:
    build:
      context: ./website_business
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://anyamusicschool.com}
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://anyamusicschool.com/api/v1}
    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://anyamusicschool.com}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://anyamusicschool.com/api/v1}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecom-celery-beat
    command: celery -A app.core.celery_app.celery_app beat --loglevel=INFO
    env_file:
      - ./Backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

# Data persists in Docker volumes named {COMPOSE_PROJECT_NAME}_pg_data (set in root .env).
volumes:
  pg_data:
  redis_data:
  backend_uploads:

networks:
  app-network:
    name: ecom-app-network
