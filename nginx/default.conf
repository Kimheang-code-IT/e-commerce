# HTTP — use http://SERVER_IP for LAN (recommended)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    include /etc/nginx/snippets/wifi-proxy.conf;
}

# HTTPS — self-signed cert (local/LAN); browsers will warn until you trust the cert
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/wifi-proxy.conf;
}
